[project]
name = "re-lab"
version = "0.1.0"
description = "Reverse-engineering lab: generic binary/structure/analysis tooling plus per-format probes and notes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click",
    "olefile",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
